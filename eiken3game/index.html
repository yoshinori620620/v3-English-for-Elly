<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☆さっくんの！サクサク推し英語 - アクションゲーム版☆</title>
    <style>
        :root { --primary-color: #FF69B4; --success-color: #2ECC71; --error-color: #E74C3C; }
        body { font-family: sans-serif; background-color: #FFF0F5; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .game-container { background: white; border-radius: 20px; padding: 15px; width: 100%; max-width: 440px; border: 3px solid #FFB6C1; text-align: center; }
        .app-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        #gameCanvas { background: linear-gradient(to bottom, #87CEEB, #E0F6FF); border: 2px solid #333; border-radius: 12px; display: block; margin: 0 auto; max-width: 100%; }
        .hint-banner { background-color: #FFF5F7; padding: 8px; border-radius: 8px; font-weight: bold; font-size: 13px; margin-bottom: 10px; border-left: 5px solid var(--primary-color); text-align: left; }
        .overlay { display: none; margin-top: 15px; padding: 15px; border-radius: 12px; background-color: #F8FAFC; border: 2px solid #FFB6C1; text-align: left; }
        .action-btn { margin-top: 12px; width: 100%; background-color: #FF1493; color: white; border: none; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="app-nav">
        <button onclick="goToPortal()" style="background:#FF1493; color:white; border:none; padding:6px 12px; border-radius:8px; font-weight:bold; cursor:pointer;">🚪 Portal</button>
        <div id="score-display" style="font-weight:bold; color:#FF1493;">SCORE: 0</div>
    </div>

    <div class="hint-banner" id="current-hint">読み込み中...</div>
    <canvas id="gameCanvas" width="400" height="240"></canvas>

    <div id="feedback-overlay" class="overlay">
        <div id="overlay-title" style="font-weight:bold;"></div>
        <div id="feedback-content" style="font-size:13px; margin-top:8px;"></div>
        <button class="action-btn" onclick="reviveAndNext()">次の問題へ 👉</button>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // 🌟 全て中身が異なる独立した英検3級単語・熟語問題データセット（重複一切なし）
    const masterQuestionList = [
        { id: 1, sentence: "This castle was built in the 15th ______.", answer: "century", options: ["century", "culture", "season"], translation: "このお城は15世紀に建てられました。" },
        { id: 2, sentence: "I completely ______ with your opinion.", answer: "agree", options: ["agree", "decide", "complain"], translation: "私はあなたの意見に完全に同意します。" },
        { id: 3, sentence: "She wants to take ______ in the speech contest.", answer: "part", options: ["part", "care", "place"], translation: "彼女はスピーチコンテストに参加したい。" },
        { id: 4, sentence: "We are looking forward ______ seeing you again.", answer: "to", options: ["to", "for", "at"], translation: "またお会いできるのを楽しみに待っています。" },
        { id: 5, sentence: "Please take ______ of my dog while I am away.", answer: "care", options: ["care", "look", "part"], translation: "留守の間、私の犬の世話をお願いします。" },
        { id: 6, sentence: "Living near the train station is very ______.", answer: "convenient", options: ["convenient", "dangerous", "difficult"], translation: "駅の近くに住むのはとても便利です。" },
        { id: 7, sentence: "______ first, I found English grammar hard.", answer: "At", options: ["At", "In", "On"], translation: "最初、私は英文法が難しいと感じた。" },
        { id: 8, sentence: "She decided to ______ the new job offer.", answer: "accept", options: ["accept", "refuse", "forget"], translation: "彼女は新しい仕事のオファーを受け入れることにした。" },
        { id: 9, sentence: "He worked very hard to ______ his goal.", answer: "achieve", options: ["achieve", "lose", "miss"], translation: "彼は目標を達成するために一生懸命働いた。" },
        { id: 10, sentence: "My grandfather is still very ______ at 80.", answer: "active", options: ["active", "sleepy", "quiet"], translation: "私の祖父は80歳になってもまだとても活発です。" },
        { id: 11, sentence: "High speed is a major ______ of the train.", answer: "advantage", options: ["advantage", "problem", "error"], translation: "高速移動はその列車の大きな利点です。" },
        { id: 12, sentence: "My teacher gave me very helpful ______.", answer: "advice", options: ["advice", "news", "noise"], translation: "先生はとても役に立つ助言をくれました。" },
        { id: 13, sentence: "I cannot ______ to buy a luxury car now.", answer: "afford", options: ["afford", "spend", "cost"], translation: "私には今高級車を買う余裕はありません。" },
        { id: 14, sentence: "Don't be ______ of making small mistakes.", answer: "afraid", options: ["afraid", "happy", "excited"], translation: "小さな失敗を恐れないでください。" },
        { id: 15, sentence: "My parents won't ______ me to stay out late.", answer: "allow", options: ["allow", "stop", "prevent"], translation: "両親は私が遅くまで外出するのを許さないでしょう。" },
        { id: 16, sentence: "I have ______ finished writing the report.", answer: "almost", options: ["almost", "never", "seldom"], translation: "レポートをほとんど書き終えました。" },
        { id: 17, sentence: "The express train has ______ left the station.", answer: "already", options: ["already", "yet", "still"], translation: "急行電車はすでに出発してしまいました。" },
        { id: 18, sentence: "We need a large ______ of water for planting.", answer: "amount", options: ["amount", "number", "count"], translation: "植樹には大量の水が必要です。" },
        { id: 19, sentence: "They visited an ______ pyramid in Egypt.", answer: "ancient", options: ["ancient", "modern", "future"], translation: "彼らはエジプトの古代のピラミッドを訪れました。" },
        { id: 20, sentence: "Why are you getting so ______ at me?", answer: "angry", options: ["angry", "kind", "gentle"], translation: "なぜ私に対してそんなに怒っているのですか？" },
        { id: 21, sentence: "The winner will be ______ tomorrow morning.", answer: "announced", options: ["announced", "hidden", "kept"], translation: "勝者は明日の朝発表されます。" },
        { id: 22, sentence: "Would you like ______ cup of tea?", answer: "another", options: ["another", "other", "others"], translation: "お茶をもう一杯いかがですか？" },
        { id: 23, sentence: "Please ______ my email when you read it.", answer: "answer", options: ["answer", "ask", "speak"], translation: "メールを読んだら返信（回答）してください。" },
        { id: 24, sentence: "She felt ______ about her final examination.", answer: "anxious", options: ["anxious", "calm", "safe"], translation: "彼女は期末試験について心配（不安）に感じていた。" },
        { id: 25, sentence: "He came over to ______ for his mistake.", answer: "apologize", options: ["apologize", "thank", "praise"], translation: "彼は自分の失敗を謝罪するためにやってきた。" },
        { id: 26, sentence: "A beautiful rainbow ______ in the blue sky.", answer: "appeared", options: ["appeared", "disappeared", "faded"], translation: "青空に美しい虹が現れた。" },
        { id: 27, sentence: "I decided to ______ for the scholarship.", answer: "apply", options: ["apply", "reply", "supply"], translation: "私は奨学金に応募（申請）することに決めた。" },
        { id: 28, sentence: "I made an ______ to see the doctor at 3 PM.", answer: "appointment", options: ["appointment", "invitation", "event"], translation: "午後3時に医師の診察予約をしました。" },
        { id: 29, sentence: "This ______ is famous for its delicious apples.", answer: "area", options: ["area", "sky", "ocean"], translation: "この地域は美味しいりんごで有名です。" },
        { id: 30, sentence: "They always ______ about which movie to watch.", answer: "argue", options: ["argue", "agree", "smile"], translation: "彼らはどの映画を観るかでいつも議論（口論）します。" }
    ];

    const STORAGE_KEY = "game_eiken3_unique_history_v10";
    
    function getPlayedSet() {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? new Set(JSON.parse(saved)) : new Set();
    }

    function markAsPlayed(id) {
        const set = getPlayedSet();
        set.add(id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...set]));
    }

    let unplayedQueue = [];
    
    function resetShuffleQueue() {
        const playedSet = getPlayedSet();
        let unseen = masterQuestionList.filter(q => !playedSet.has(q.id)).map(q => q.id);
        
        // 全問題（全30問）解き切ったら履歴を自動リセットして周回
        if (unseen.length === 0) {
            localStorage.removeItem(STORAGE_KEY);
            unseen = masterQuestionList.map(q => q.id);
        }
        
        // 未回答問題を100%完全シャッフル
        unseen.sort(() => Math.random() - 0.5);
        unplayedQueue = unseen;
    }

    let bird = { x: 50, y: 100, radius: 12, gravity: 0.35, lift: -5.0, velocity: 0 };
    let items = [];
    let gameScore = 0;
    let currentActiveQuestion = null;
    let gameState = "PLAYING"; 

    canvas.addEventListener("mousedown", () => { if (gameState === "PLAYING") bird.velocity = bird.lift; });
    canvas.addEventListener("touchstart", (e) => { 
        if (gameState === "PLAYING") { e.preventDefault(); bird.velocity = bird.lift; } 
    }, {passive: false});

    function setupQuestion() {
        if (unplayedQueue.length === 0) resetShuffleQueue();
        const nextId = unplayedQueue.pop();
        currentActiveQuestion = masterQuestionList.find(q => q.id === nextId);

        document.getElementById("current-hint").innerText = `【第${currentActiveQuestion.id}問 / 全${masterQuestionList.length}問】\n「${currentActiveQuestion.translation}」\n${currentActiveQuestion.sentence}`;
        
        items = [];
        let shuffled = [...currentActiveQuestion.options].sort(() => Math.random() - 0.5);
        shuffled.forEach((text, index) => {
            items.push({ 
                x: 400 + (index * 120), 
                y: 40 + (Math.random() * 120), 
                text: text, 
                isAnswer: (text === currentActiveQuestion.answer), 
                width: 75, 
                height: 28 
            });
        });
    }

    function gameLoop() {
        if (gameState === "PLAYING") {
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;
            if (bird.y > canvas.height) bird.y = canvas.height;
            if (bird.y < 0) bird.y = 0;

            items.forEach(item => {
                item.x -= 1.8;
                if (bird.x + 12 > item.x && bird.x - 12 < item.x + item.width && bird.y + 12 > item.y && bird.y - 12 < item.y + item.height) {
                    triggerFeedback(item.isAnswer);
                }
            });
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        items.forEach(item => {
            ctx.fillStyle = "#FFF"; ctx.fillRect(item.x, item.y, item.width, item.height);
            ctx.fillStyle = "#333"; ctx.font = "bold 12px Arial"; ctx.fillText(item.text, item.x + 10, item.y + 18);
        });

        ctx.fillStyle = "#FF69B4"; ctx.beginPath(); ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2); ctx.fill();
        requestAnimationFrame(gameLoop);
    }

    function triggerFeedback(isCorrect) {
        gameState = "HIT_FEEDBACK";
        markAsPlayed(currentActiveQuestion.id);

        if(isCorrect) gameScore += 10;
        document.getElementById("score-display").innerText = `SCORE: ${gameScore}`;

        const overlay = document.getElementById("feedback-overlay");
        document.getElementById("overlay-title").innerText = isCorrect ? "🎉 大正解！" : "😢 どんまい！";
        document.getElementById("feedback-content").innerText = `正解: ${currentActiveQuestion.answer}\n訳: ${currentActiveQuestion.translation}`;
        overlay.style.display = "block";
    }

    function reviveAndNext() {
        document.getElementById("feedback-overlay").style.display = "none";
        bird.y = 100; bird.velocity = 0;
        gameState = "PLAYING";
        setupQuestion();
    }

    function goToPortal() { 
        window.location.href = "https://yoshinori620620.github.io/v3-English-for-Elly/index.html"; 
    }

    resetShuffleQueue();
    setupQuestion();
    gameLoop();
</script>
</body>
</html>
