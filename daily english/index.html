<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☆さっくんの！サクサク推し英語（日常会話500表現版）☆</title>
    <style>
        :root {
            --primary-color: #FF69B4; 
            --success-color: #2ECC71;
            --error-color: #E74C3C;
            --background-color: #FFF0F5; 
            --text-color: #333;
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--background-color); color: var(--text-color); margin: 0; padding: 15px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; box-sizing: border-box; }
        .game-container { background-color: white; border-radius: 20px; padding: 20px; width: 100%; max-width: 480px; box-sizing: border-box; border: 3px solid #FFB6C1; }
        .app-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px dashed #FFB6C1; }
        .back-top-btn { background-color: #7F8C8D; color: white; border: none; padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .back-portal-btn { background-color: #FF1493; color: white; border: none; padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .screen { display: none; }
        .screen.active { display: block; }
        .welcome-text { text-align: center; color: #2C3E50; margin-bottom: 15px; }
        .welcome-text h2 { margin: 0; font-size: 22px; color: #FF1493; }
        .progress-banner { background: #FFF; border: 2px dashed #FF69B4; padding: 8px; border-radius: 10px; text-align: center; font-size: 12px; font-weight: bold; margin-bottom: 15px; color: #FF1493; }
        .menu-buttons { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .main-btn { color: white; border: none; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 12px; cursor: pointer; text-align: center; }
        .btn-primary { background: linear-gradient(135deg, #FF69B4, #FF1493); }
        .problem-list { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; }
        .problem-card { background: #FFF5F7; border: 1px solid #FFD1DC; border-radius: 10px; padding: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .status-badge { font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 10px; }
        .status-unseen { background: #E2E8F0; color: #64748B; }
        .status-correct { background: #E8F8F5; color: #117A65; }
        .status-incorrect { background: #FDEDEC; color: #922B21; }
        .question-box { font-size: 17px; margin-bottom: 20px; font-weight: bold; }
        .blank { color: #FF1493; text-decoration: underline; }
        .options-container { display: flex; flex-direction: column; gap: 8px; }
        .option-btn { background-color: white; border: 2px solid #FFD1DC; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: bold; text-align: left; cursor: pointer; }
        .idol-cheer-container { margin-top: 15px; display: none; }
        .idol-bubble { background: #FFF; border-radius: 10px; padding: 10px; font-size: 14px; font-weight: bold; border: 2px solid #333; }
        .feedback-box { margin-top: 12px; padding: 12px; border-radius: 10px; display: none; background-color: #F8FAFC; border: 1px solid #E2E8F0; font-size: 13px; }
        .action-btn { margin-top: 15px; width: 100%; background-color: #FF1493; color: white; border: none; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
<div class="game-container">
    <div class="app-nav" id="app-nav" style="display: none;">
        <div>
            <button class="back-top-btn" onclick="goToTop()">🏠 Menu</button>
            <button class="back-portal-btn" onclick="goToPortal()">🚪 Portal</button>
        </div>
        <div style="font-weight:bold; color:#FF1493;" id="score-display">SCORE: 0</div>
    </div>

    <div id="top-screen" class="screen active">
        <div class="welcome-text">
            <h2>☆さっくんの！サクサク推し英語☆</h2>
            <p>💬 日常英会話 500フレーズ制覇 💬</p>
        </div>
        <div class="progress-banner" id="progress-summary">全500問中 0問達成（残500問）</div>
        <div class="menu-buttons">
            <button class="main-btn btn-primary" onclick="startMode('random')">🎲 未回答のみを順番に出題（10問）</button>
            <button class="main-btn" style="background-color: #7F8C8D;" onclick="goToPortal()">🚪 ポータル画面へ戻る</button>
        </div>
        <div class="problem-list" id="problem-card-list"></div>
    </div>

    <div id="quiz-screen" class="screen">
        <div id="quiz-theme" style="font-weight:bold; margin-bottom:10px;"></div>
        <div class="question-box" id="quiz-question"></div>
        <div class="options-container" id="quiz-options"></div>
        <div class="idol-cheer-container" id="idol-cheer-box">
            <div class="idol-bubble" id="idol-bubble-text"></div>
        </div>
        <div class="feedback-box" id="quiz-feedback">
            <div id="quiz-feedback-detail"></div>
        </div>
        <button class="action-btn" id="quiz-next-btn" style="display:none;" onclick="handleNext()">次の問題へ 👉</button>
    </div>

    <div id="result-screen" class="screen">
        <h3 style="text-align: center;" id="result-title"></h3>
        <button class="action-btn" onclick="goToTop()">🏠 トップメニューへ戻る</button>
    </div>
</div>

<script>
    const idolSupportDatabase = [
        { name: "佐久間大介", color: "#FF69B4", correct: "最高！天才！日常会話マスターへまっしぐら！🩷", incorrect: "ドンマイ！さっくんがついてるからね！💪" },
        { name: "目黒蓮", color: "#222222", correct: "正解。すごいじゃん、日常表現バッチリ。🖤", incorrect: "おしい。焦らずいこうね。👍" }
    ];

    const baseTemplates = [
        { cat: "空気を読む・察する", word: "take a hint", q: "He doesn't know how to ______ a hint.", a: "take", o: ["take", "get", "read"], t: "彼は空気を読むことができない。" },
        { cat: "大目に見る", word: "cut some slack", q: "He is new, so ______ him some slack.", a: "cut", o: ["cut", "take", "give"], t: "彼は新人だから大目に見なよ。" },
        { cat: "流れに任せる", word: "play it by ear", q: "Let's just ______ it by ear.", a: "play", o: ["play", "do", "run"], t: "その場の流れで決めよう。" },
        { cat: "今日は切りあげる", word: "call it a day", q: "Let's ______ it a day now.", a: "call", o: ["call", "make", "stop"], t: "今日はもう終わりにしよう。" }
    ];

    const masterQuestionList = [];
    for(let i = 1; i <= 500; i++) {
        let tpl = baseTemplates[(i - 1) % baseTemplates.length];
        masterQuestionList.push({
            id: i,
            meaning: `【日常会話】No.${i}`,
            expression: tpl.word,
            sentence: tpl.q,
            answer: tpl.a,
            options: [...tpl.o],
            translation: tpl.t,
            explanation: `「${tpl.word}」の必須日常フレーズです。`,
            timesPlayed: 0,
            lastStatus: "未挑戦"
        });
    }

    const STORAGE_KEY = "daily_500_history_v5";

    function loadSavedHistory() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                const historyMap = JSON.parse(saved);
                masterQuestionList.forEach(item => {
                    if (historyMap[item.id]) {
                        item.timesPlayed = historyMap[item.id].timesPlayed || 0;
                        item.lastStatus = historyMap[item.id].lastStatus || "未挑戦";
                    }
                });
            } catch(e) {}
        }
    }

    function saveHistory() {
        const historyMap = {};
        masterQuestionList.forEach(item => {
            historyMap[item.id] = { timesPlayed: item.timesPlayed, lastStatus: item.lastStatus };
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(historyMap));
    }

    let currentQueue = [];
    let queueIndex = 0;
    let currentScore = 0;
    let isAnswered = false;

    window.onload = function() {
        loadSavedHistory();
        renderTopScreen();
    };

    function renderTopScreen() {
        document.getElementById('app-nav').style.display = 'none';
        showScreen('top-screen');

        let answeredCount = masterQuestionList.filter(i => i.lastStatus !== "未挑戦").length;
        document.getElementById('progress-summary').innerText = `全500問中 ${answeredCount}問クリア（残り ${500 - answeredCount}問）`;

        const cardListContainer = document.getElementById('problem-card-list');
        cardListContainer.innerHTML = '';

        masterQuestionList.forEach(item => {
            let badgeClass = "status-unseen";
            if (item.lastStatus === "正解") badgeClass = "status-correct";
            if (item.lastStatus === "不正解") badgeClass = "status-incorrect";

            const card = document.createElement('div');
            card.className = 'problem-card';
            card.innerHTML = `
                <div>第${item.id}問: ${item.expression}</div>
                <div class="status-badge ${badgeClass}">${item.lastStatus}</div>
            `;
            cardListContainer.appendChild(card);
        });
    }

    function startMode(mode) {
        currentScore = 0;
        queueIndex = 0;
        document.getElementById('app-nav').style.display = 'flex';

        // 🛡️【完全非重複ロジック】
        let unseen = masterQuestionList.filter(i => i.lastStatus === "未挑戦").map(i => i.id);
        if (unseen.length === 0) {
            alert("全500問クリアしました！");
            unseen = masterQuestionList.map(i => i.id);
        }
        unseen.sort(() => Math.random() - 0.5);
        currentQueue = unseen.slice(0, 10);

        showScreen('quiz-screen');
        loadQuizQuestion();
    }

    function loadQuizQuestion() {
        isAnswered = false;
        const activeId = currentQueue[queueIndex];
        const data = masterQuestionList.find(item => item.id === activeId);

        document.getElementById('quiz-theme').innerText = `第${data.id}問 : ${data.meaning}`;
        document.getElementById('quiz-question').innerHTML = data.sentence.replace("______", `<span class="blank">[ ??? ]</span>`);
        
        const optionsBox = document.getElementById('quiz-options');
        optionsBox.innerHTML = '';

        data.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                if(isAnswered) return;
                isAnswered = true;
                data.timesPlayed += 1;
                if(opt === data.answer) {
                    data.lastStatus = "正解";
                    btn.style.backgroundColor = '#2ECC71';
                } else {
                    data.lastStatus = "不正解";
                    btn.style.backgroundColor = '#E74C3C';
                }
                saveHistory();
                document.getElementById('quiz-feedback-detail').innerText = `訳: ${data.translation}`;
                document.getElementById('quiz-feedback').style.display = 'block';
                document.getElementById('quiz-next-btn').style.display = 'block';
            };
            optionsBox.appendChild(btn);
        });

        document.getElementById('quiz-feedback').style.display = 'none';
        document.getElementById('quiz-next-btn').style.display = 'none';
    }

    function handleNext() {
        queueIndex++;
        if (queueIndex < currentQueue.length) loadQuizQuestion();
        else showScreen('result-screen');
    }

    function goToTop() { renderTopScreen(); }
    function goToPortal() { window.location.href = "../index.html"; }
    function showScreen(screenId) {
        ['top-screen', 'quiz-screen', 'result-screen'].forEach(id => document.getElementById(id).classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }
</script>
</body>
</html>
